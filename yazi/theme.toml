[mgr]
cwd = { fg = "#f5c2e7", italic = true }

hovered = { fg = "#1e1e2e", bg = "#f5c2e7", bold = true }
preview_hovered = { underline = true }

find_keyword  = { fg = "#f5c2e7", bold = true, italic = true }
find_position = { fg = "#f5c2e7", bg = "reset", italic = true }

marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#fb6f92", bg = "#fb6f92" }
marker_selected = { fg = "#f9e2af", bg = "#f9e2af" }

count_copied   = { fg = "#1e1e2e", bg = "#a6e3a1" }
count_cut      = { fg = "#1e1e2e", bg = "#f38ba8" }
count_selected = { fg = "#1e1e2e", bg = "#f9e2af" }

border_style = { fg = "#f5c2e7" }
border_symbol = "│"

[mode]
normal_main = { fg = "#1e1e2e", bg = "#f5c2e7", bold = true }
normal_alt  = { fg = "#f5c2e7", bg = "#313244" }
select_main = { fg = "#1e1e2e", bg = "#fb6f92", bold = true }
select_alt  = { fg = "#fb6f92", bg = "#313244" }
unset_main = { fg = "#1e1e2e", bg = "#f2cdcd", bold = true }
unset_alt  = { fg = "#f2cdcd", bg = "#313244" }

[tabs]
active   = { fg = "#1e1e2e", bg = "#f5c2e7", bold = true }
inactive = { fg = "#f2f2f2", bg = "#1e1e2e" }

[filetype]
rules = [
    { url = "*/", fg = "#f5c2e7" }
]

[status]
perm_sep   = { fg = "#6c7086" }
perm_type  = { fg = "#f5c2e7" }
perm_read  = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec  = { fg = "#a6e3a1" }

progress_label  = { fg = "#f2f2f2", bold = true }
progress_normal = { fg = "#f5c2e7", bg = "#313244" }
progress_error  = { fg = "#f9e2af", bg = "#f38ba8" }

[icon]
prepend_dirs = [
    { name = ".config",     text = "", fg = "#f5c2e7" },
    { name = ".git",        text = "", fg = "#f5c2e7" },
    { name = ".github",     text = "", fg = "#f5c2e7" },
    { name = ".npm",        text = "", fg = "#f5c2e7" },
    { name = "Desktop",     text = "", fg = "#f5c2e7" },
    { name = "Development", text = "", fg = "#f5c2e7" },
    { name = "Documents",   text = "", fg = "#f5c2e7" },
    { name = "Downloads",   text = "", fg = "#f5c2e7" },
    { name = "Library",     text = "", fg = "#f5c2e7" },
    { name = "Movies",      text = "", fg = "#f5c2e7" },
    { name = "Music",       text = "", fg = "#f5c2e7" },
    { name = "Pictures",    text = "", fg = "#f5c2e7" },
    { name = "Public",      text = "", fg = "#f5c2e7" },
    { name = "Videos",      text = "", fg = "#f5c2e7" },
]

[pick]
border   = { fg = "#f5c2e7" }
active   = { fg = "#fb6f92", bold = true }
inactive = {}

[input]
border   = { fg = "#f5c2e7" }
title    = {}
value    = {}
selected = { reversed = true }

[cmp]
border = { fg = "#f5c2e7" }

[tasks]
border  = { fg = "#f5c2e7" }
title   = {}
hovered = { fg = "#fb6f92", bold = true }

[which]
border          = { fg = "#f5c2e7" }
cand            = { fg = "#fb6f92" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#fb6f92" }
run     = { fg = "#f5c2e7" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#313244", bg = "#f2f2f2" }

[spot]
border   = { fg = "#f5c2e7" }
title    = { fg = "#f5c2e7" }
tbl_col  = { fg = "#fb6f92" }
tbl_cell = { fg = "#f5c2e7", bg = "#45475a" }

[notify]
title_info  = { fg = "#a6e3a1" }
title_warn  = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#94e2d5" },
	{ mime = "**/{audio,video}/*", fg = "#f9e2af" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#fb6f92" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#a6e3a1" },
	{ mime = "vfs/{absent,stale}", fg = "#9399b2" },
	{ url = "*", fg = "#f2f2f2" },
	{ url = "*/", fg = "#f5c2e7" },
]

prepend_conds = [
    { if = "dir", text = "", fg = "#f5c2e7" }
]
