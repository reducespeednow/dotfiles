format = """
[](#9A348E)\
$os\
$username\
[](bg:#DA627D fg:#9A348E)\
$directory\
[](fg:#DA627D bg:#FCA17D)\
$git_branch\
$git_status\
[](fg:#FCA17D bg:#86BBD8)\
$c\
$golang\
$haskell\
$java\
$nodejs\
$python\
$rust\
[](fg:#86BBD8 bg:#06969A)\
$docker_context\
[](fg:#06969A bg:#33658A)\
$cmd_duration\
$time\
[ ](fg:#33658A)\
$character"""

# Distro logo. Uses the os module (not a username hack) so the symbol is
# resolved per-OS instead of hardcoded.
[os]
disabled = false
style = "bg:#9A348E"
format = '[$symbol]($style)'

[os.symbols]
Arch = "󰣇"

# Only shown when running as root or over SSH -- otherwise it is just noise.
[username]
disabled = false
show_always = false
style_user = "bg:#9A348E fg:#f2f2f2"
style_root = "bg:#9A348E fg:#f38ba8 bold"
format = '[ $user ]($style)'

[directory]
style = "bg:#DA627D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#FCA17D"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#FCA17D"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = " "
style = "bg:#86BBD8"
format = '[ $symbol ($version) (\($virtualenv\)) ]($style)'

[rust]
symbol = ""
style = "bg:#86BBD8"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#06969A"
format = '[ $symbol $context ]($style)'

# Only rendered when a command took longer than min_time.
[cmd_duration]
min_time = 2000
style = "bg:#33658A"
format = '[ 󰔟 $duration ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#33658A"
format = '[ ♥ $time ]($style)'

# Trailing prompt symbol. Doubles as the vi-mode indicator (fish_vi_key_bindings)
# and the exit-status indicator: green on success, red on a non-zero exit.
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #f5c2e7)"
vimcmd_visual_symbol = "[❮](bold #f9e2af)"
vimcmd_replace_symbol = "[❮](bold #cba6f7)"
vimcmd_replace_one_symbol = "[❮](bold #cba6f7)"
